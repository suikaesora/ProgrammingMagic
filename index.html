<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>コード修行</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Source+Code+Pro:wght@400;600&display=swap">
  <!-- 色・線・角丸などの見た目は css/theme.css で一括設定 -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/scenes/intro.css">
  <link rel="stylesheet" href="css/scenes/home.css">
  <link rel="stylesheet" href="css/scenes/lesson.css">
  <link rel="stylesheet" href="css/scenes/clear.css">
  <link rel="stylesheet" href="css/scenes/cert.css">
  <link rel="stylesheet" href="css/scenes/deco.css">
  <script>
    // 画面のちらつきを防ぐため、テーマだけ先に適用する
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('present-webapp:v1') || '{}');
        var t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>この教材を使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
